name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test and build (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Unit tests
        run: pytest tests/unit -v

      - name: Integration tests (pipeline, SQL, real snapshot end-to-end)
        run: pytest tests/integration -v --ignore=tests/integration/test_dashboard.py

      - name: Run the ETL pipeline from the committed snapshot
        run: python -m copenhagen_data_lab.pipeline --source snapshot

      - name: Validate DuckDB outputs
        run: python scripts/check_warehouse.py

      - name: Dashboard renders every page (Streamlit AppTest)
        run: pytest tests/integration/test_dashboard.py -v

      # The live StatBank smoke test is deliberately not run here; see refresh-data.yml.
